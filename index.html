<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f0e6f6;
      --bg-deep: #e4d5f0;
      --card: #ffffff;
      --pink: #ff7eb3;
      --pink-deep: #ff5c9e;
      --lavender: #c9b8e8;
      --mint: #7ed6bc;
      --mint-deep: #5bc4a8;
      --peach: #ffb5a7;
      --sky: #89c4f4;
      --text: #3d2c4e;
      --text-light: #7a6b8a;
      --shadow: rgba(100, 60, 130, 0.12);
      --shadow-strong: rgba(100, 60, 130, 0.22);
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 1200px;
    }

    /* ─── animated background blobs ─── */
    .bg-blobs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: blobFloat 12s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 420px;
      height: 420px;
      background: var(--pink);
      top: -10%;
      left: -8%;
      animation-duration: 14s;
    }

    .blob-2 {
      width: 350px;
      height: 350px;
      background: var(--lavender);
      bottom: -12%;
      right: -6%;
      animation-duration: 11s;
      animation-delay: -3s;
    }

    .blob-3 {
      width: 280px;
      height: 280px;
      background: var(--mint);
      top: 55%;
      left: 60%;
      animation-duration: 16s;
      animation-delay: -7s;
    }

    .blob-4 {
      width: 200px;
      height: 200px;
      background: var(--peach);
      top: 20%;
      right: 15%;
      animation-duration: 13s;
      animation-delay: -5s;
    }

    .blob-5 {
      width: 160px;
      height: 160px;
      background: var(--sky);
      bottom: 20%;
      left: 15%;
      animation-duration: 15s;
      animation-delay: -2s;
    }

    @keyframes blobFloat {
      0%   { transform: translate(0, 0) scale(1); }
      33%  { transform: translate(30px, -40px) scale(1.08); }
      66%  { transform: translate(-20px, 25px) scale(0.95); }
      100% { transform: translate(15px, -15px) scale(1.04); }
    }

    /* ─── floating emoji decorations ─── */
    .floating-decor {
      position: fixed;
      z-index: 1;
      pointer-events: none;
      font-size: 1.6rem;
      animation: floatUp 18s linear infinite;
      opacity: 0;
    }

    @keyframes floatUp {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* ─── 3D scene ─── */
    .scene {
      position: relative;
      z-index: 2;
      width: 420px;
      max-width: 92vw;
      perspective: 1200px;
    }

    .card-wrapper {
      position: relative;
      width: 100%;
      transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card-wrapper.flipped {
      transform: rotateY(180deg);
    }

    .card {
      width: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 44px 36px 36px;
      box-shadow:
        0 2px 4px var(--shadow),
        0 12px 40px var(--shadow-strong),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      transform-style: preserve-3d;
    }

    .card-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotateY(180deg);
    }

    /* ─── mascot / avatar area ─── */
    .avatar-ring {
      width: 80px;
      height: 80px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--lavender), var(--mint));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(255, 126, 179, 0.3);
      animation: ringPulse 3s ease-in-out infinite;
    }

    @keyframes ringPulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(255, 126, 179, 0.3); }
      50%      { box-shadow: 0 4px 32px rgba(255, 126, 179, 0.5); }
    }

    .avatar-face {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .avatar-face:hover {
      transform: scale(1.12) rotate(-8deg);
    }

    /* ─── headings ─── */
    .card h2 {
      text-align: center;
      font-weight: 800;
      font-size: 1.55rem;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .card .subtitle {
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-light);
      margin-bottom: 28px;
      font-weight: 600;
    }

    /* ─── form fields ─── */
    .field {
      position: relative;
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }

    .field .input-wrap {
      position: relative;
    }

    .field .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.05rem;
      pointer-events: none;
      opacity: 0.55;
      transition: opacity 0.25s, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .field input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      border: 2px solid transparent;
      border-radius: 14px;
      background: var(--bg);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }

    .field input::placeholder {
      color: #bfa8cc;
      font-weight: 600;
    }

    .field input:focus {
      border-color: var(--pink);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 126, 179, 0.15);
    }

    .field input:focus ~ .input-icon,
    .field input:focus + .input-icon {
      opacity: 1;
      transform: translateY(-50%) scale(1.2);
    }

    .field input:focus + .toggle-pw {
      opacity: 1;
    }

    /* ─── password toggle ─── */
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      opacity: 0.35;
      transition: opacity 0.25s;
      padding: 4px;
    }

    .toggle-pw:hover {
      opacity: 0.7;
    }

    /* ─── row helpers ─── */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .row label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text-light);
    }

    .row a {
      color: var(--pink-deep);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s;
    }

    .row a:hover {
      color: var(--pink);
      text-decoration: underline;
    }

    /* custom checkbox */
    .check-box {
      width: 18px;
      height: 18px;
      border: 2px solid var(--lavender);
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s, border-color 0.25s;
      flex-shrink: 0;
    }

    .check-box svg {
      width: 11px;
      height: 11px;
      stroke: #fff;
      stroke-width: 2.5;
      fill: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .field input[type="checkbox"] {
      display: none;
    }

    .field input[type="checkbox"]:checked + .check-box {
      background: var(--pink);
      border-color: var(--pink);
    }

    .field input[type="checkbox"]:checked + .check-box svg {
      opacity: 1;
    }

    /* ─── primary button ─── */
    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--pink), var(--lavender));
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 18px rgba(255, 126, 179, 0.35);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 6px 28px rgba(255, 126, 179, 0.45);
    }

    .btn-primary:hover::after {
      transform: translateX(100%);
    }

    .btn-primary:active {
      transform: translateY(0) scale(0.98);
    }

    /* ─── divider ─── */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-light);
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--lavender), transparent);
    }

    /* ─── social buttons ─── */
    .socials {
      display: flex;
      gap: 12px;
    }

    .btn-social {
      flex: 1;
      padding: 12px;
      border: 2px solid rgba(201, 184, 232, 0.4);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      transition: border-color 0.25s, background 0.25s, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-social:hover {
      border-color: var(--pink);
      background: #fff;
      transform: translateY(-2px);
    }

    .btn-social .social-icon {
      font-size: 1.15rem;
    }

    /* ─── toggle link ─── */
    .toggle-text {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-light);
    }

    .toggle-text button {
      background: none;
      border: none;
      color: var(--pink-deep);
      font-family: inherit;
      font-size: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: color 0.2s;
    }

    .toggle-text button:hover {
      color: var(--pink);
      text-decoration: underline;
    }

    /* ─── eye bounce on load ─── */
    @keyframes bounceIn {
      0%   { transform: scale(0.3); opacity: 0; }
      50%  { transform: scale(1.08); }
      70%  { transform: scale(0.95); }
      100% { transform: scale(1); opacity: 1; }
    }

    .avatar-ring {
      animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                 ringPulse 3s ease-in-out 0.6s infinite;
    }

    /* ─── staggered field entrance ─── */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card .field:nth-child(1) { animation: slideUp 0.45s ease 0.15s both; }
    .card .field:nth-child(2) { animation: slideUp 0.45s ease 0.25s both; }
    .card .btn-primary        { animation: slideUp 0.45s ease 0.35s both; }
    .card .row                { animation: slideUp 0.45s ease 0.40s both; }
    .card .divider            { animation: slideUp 0.45s ease 0.45s both; }
    .card .socials            { animation: slideUp 0.45s ease 0.50s both; }
    .card .toggle-text        { animation: slideUp 0.45s ease 0.55s both; }

    .card-back .field:nth-child(1) { animation-delay: 0.15s; }
    .card-back .field:nth-child(2) { animation-delay: 0.22s; }
    .card-back .field:nth-child(3) { animation-delay: 0.29s; }

    /* ─── subtle tilt on mouse move ─── */
    .scene.tilt-active .card-wrapper {
      transition: transform 0.1s ease-out;
    }

    .scene.tilt-active .card-wrapper.flipped {
      transition: none;
    }

    /* ─── sparkle effect on click ─── */
    .sparkle {
      position: absolute;
      pointer-events: none;
      z-index: 10;
    }

    .sparkle span {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: sparklePop 0.6s ease-out forwards;
    }

    @keyframes sparklePop {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* ─── responsive ─── */
    @media (max-width: 480px) {
      .scene {
        width: 100%;
        max-width: 100vw;
        padding: 0 12px;
      }

      .card {
        padding: 36px 24px 28px;
        border-radius: 22px;
      }

      .socials {
        flex-direction: column;
      }

      .blob-1 { width: 260px; height: 260px; }
      .blob-2 { width: 220px; height: 220px; }
      .blob-3 { width: 180px; height: 180px; }
      .blob-4, .blob-5 { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- animated background blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-5"></div>
  </div>

  <!-- floating emoji decorations -->
  <div class="floating-decor" style="left:8%; font-size:1.3rem; animation-delay:0s; animation-duration:16s;">&#10024;</div>
  <div class="floating-decor" style="left:22%; font-size:1.6rem; animation-delay:4s; animation-duration:20s;">&#127800;</div>
  <div class="floating-decor" style="left:42%; font-size:1.1rem; animation-delay:8s; animation-duration:18s;">&#11088;</div>
  <div class="floating-decor" style="left:65%; font-size:1.4rem; animation-delay:2s; animation-duration:22s;">&#128150;</div>
  <div class="floating-decor" style="left:82%; font-size:1.2rem; animation-delay:6s; animation-duration:17s;">&#10024;</div>
  <div class="floating-decor" style="left:50%; font-size:1rem; animation-delay:10s; animation-duration:19s;">&#127802;</div>

  <!-- 3D card scene -->
  <div class="scene" id="scene">
    <div class="card-wrapper" id="cardWrapper">

      <!-- ====== LOGIN CARD ====== -->
      <div class="card card-front">
        <div class="avatar-ring">
          <div class="avatar-face" id="avatarFront" title="Hi there!">&#128522;</div>
        </div>
        <h2>Welcome back!</h2>
        <p class="subtitle">So glad to see you again &#128149;</p>

        <form id="loginForm" autocomplete="off">
          <div class="field">
            <label for="loginEmail">Email</label>
            <div class="input-wrap">
              <input type="email" id="loginEmail" placeholder="hello@you.com" required>
              <span class="input-icon">&#128231;</span>
            </div>
          </div>

          <div class="field">
            <label for="loginPass">Password</label>
            <div class="input-wrap">
              <input type="password" id="loginPass" placeholder="your secret" required>
              <span class="input-icon">&#128274;</span>
              <button type="button" class="toggle-pw" data-target="loginPass" aria-label="Show password">&#128065;</button>
            </div>
          </div>

          <div class="row">
            <label>
              <input type="checkbox" id="rememberMe">
              <span class="check-box">
                <svg viewBox="0 0 12 10"><polyline points="1,5 4.5,8.5 11,1.5"/></svg>
              </span>
              Remember me
            </label>
            <a href="#">Forgot?</a>
          </div>

          <button type="submit" class="btn-primary">Let me in!</button>
        </form>

        <div class="divider">or continue with</div>

        <div class="socials">
          <button class="btn-social" type="button">
            <span class="social-icon">&#127760;</span> Google
          </button>
          <button class="btn-social" type="button">
            <span class="social-icon">&#128241;</span> Apple
          </button>
        </div>

        <p class="toggle-text">
          New here? <button type="button" onclick="flipCard()" aria-label="Go to sign up">Create an account</button>
        </p>
      </div>

      <!-- ====== SIGN-UP CARD (back) ====== -->
      <div class="card card-back">
        <div class="avatar-ring">
          <div class="avatar-face" id="avatarBack" title="Nice to meet you!">&#128521;</div>
        </div>
        <h2>Create account</h2>
        <p class="subtitle">Let's get you started &#127775;</p>

        <form id="signupForm" autocomplete="off">
          <div class="field">
            <label for="signupName">Full name</label>
            <div class="input-wrap">
              <input type="text" id="signupName" placeholder="Your name" required>
              <span class="input-icon">&#128100;</span>
            </div>
          </div>

          <div class="field">
            <label for="signupEmail">Email</label>
            <div class="input-wrap">
              <input type="email" id="signupEmail" placeholder="hello@you.com" required>
              <span class="input-icon">&#128231;</span>
            </div>
          </div>

          <div class="field">
            <label for="signupPass">Password</label>
            <div class="input-wrap">
              <input type="password" id="signupPass" placeholder="make it strong!" required minlength="6">
              <span class="input-icon">&#128272;</span>
              <button type="button" class="toggle-pw" data-target="signupPass" aria-label="Show password">&#128065;</button>
            </div>
          </div>

          <div class="row">
            <label>
              <input type="checkbox" id="agreeTerms">
              <span class="check-box">
                <svg viewBox="0 0 12 10"><polyline points="1,5 4.5,8.5 11,1.5"/></svg>
              </span>
              I agree to the terms
            </label>
          </div>

          <button type="submit" class="btn-primary">Create my account</button>
        </form>

        <div class="divider">or sign up with</div>

        <div class="socials">
          <button class="btn-social" type="button">
            <span class="social-icon">&#127760;</span> Google
          </button>
          <button class="btn-social" type="button">
            <span class="social-icon">&#128241;</span> Apple
          </button>
        </div>

        <p class="toggle-text">
          Already have one? <button type="button" onclick="flipCard()" aria-label="Go to log in">Log in instead</button>
        </p>
      </div>

    </div>
  </div>

  <script>
    /* ─── card flip ─── */
    const cardWrapper = document.getElementById('cardWrapper');
    const scene = document.getElementById('scene');
    let flipped = false;

    function flipCard() {
      flipped = !flipped;
      cardWrapper.classList.toggle('flipped', flipped);
      // retrigger animations on the now-visible face
      const face = flipped
        ? cardWrapper.querySelector('.card-back')
        : cardWrapper.querySelector('.card-front');
      face.querySelectorAll('.field, .btn-primary, .row, .divider, .socials, .toggle-text').forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight; // reflow
        el.style.animation = '';
      });
    }

    /* ─── 3D tilt on mouse move ─── */
    let tiltTimeout;
    scene.addEventListener('mousemove', e => {
      clearTimeout(tiltTimeout);
      scene.classList.add('tilt-active');
      const rect = scene.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width  - 0.5;
      const y = (e.clientY - rect.top)  / rect.height - 0.5;
      const rotateX = y * -10;
      const rotateY = x *  10;
      const base = flipped ? 180 : 0;
      cardWrapper.style.transform = `rotateX(${rotateX}deg) rotateY(${base + rotateY}deg)`;
      tiltTimeout = setTimeout(() => {
        scene.classList.remove('tilt-active');
        cardWrapper.style.transform = '';
        cardWrapper.style.transition = 'transform 0.7s cubic-bezier(0.4, 0, 0.2, 1)';
        if (flipped) cardWrapper.classList.add('flipped');
      }, 3000);
    });

    scene.addEventListener('mouseleave', () => {
      scene.classList.remove('tilt-active');
      cardWrapper.style.transform = '';
      cardWrapper.style.transition = 'transform 0.7s cubic-bezier(0.4, 0, 0.2, 1)';
      if (flipped) cardWrapper.classList.add('flipped');
    });

    /* ─── password toggle ─── */
    document.querySelectorAll('.toggle-pw').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const isPass = input.type === 'password';
        input.type = isPass ? 'text' : 'password';
        btn.innerHTML = isPass ? '&#128064;' : '&#128065;';
      });
    });

    /* ─── avatar face reactions ─── */
    const faces = {
      happy:    '\u{1F60A}',
      love:     '\u{1F60D}',
      wink:     '\u{1F609}',
      excited:  '\u{1F929}',
      blush:    '\u{1F633}',
      wink2:    '\u{1F609}'
    };
    const faceKeys = Object.keys(faces);
    let faceIdx = 0;

    function rotateFace() {
      faceIdx = (faceIdx + 1) % faceKeys.length;
      const face = flipped
        ? document.getElementById('avatarBack')
        : document.getElementById('avatarFront');
      face.style.transform = 'scale(0.6) rotate(-15deg)';
      setTimeout(() => {
        face.textContent = faces[faceKeys[faceIdx]];
        face.style.transform = 'scale(1.12) rotate(5deg)';
        setTimeout(() => face.style.transform = '', 300);
      }, 180);
    }

    setInterval(rotateFace, 3500);

    /* ─── sparkle on button click ─── */
    document.querySelectorAll('.btn-primary, .btn-social').forEach(btn => {
      btn.addEventListener('click', e => {
        const rect = btn.getBoundingClientRect();
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;
        const container = document.createElement('div');
        container.className = 'sparkle';
        container.style.left = cx + 'px';
        container.style.top  = cy + 'px';
        const colors = ['#ff7eb3', '#c9b8e8', '#7ed6bc', '#ffb5a7', '#89c4f4'];
        for (let i = 0; i < 8; i++) {
          const dot = document.createElement('span');
          const angle = (Math.PI * 2 * i) / 8;
          const dist  = 20 + Math.random() * 18;
          dot.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
          dot.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
          dot.style.background = colors[i % colors.length];
          container.appendChild(dot);
        }
        btn.appendChild(container);
        setTimeout(() => container.remove(), 700);
      });
    });

    /* ─── form submissions (demo) ─── */
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const btn = e.target.querySelector('.btn-primary');
      btn.textContent = '\u2728 Welcome!';
      btn.style.background = 'linear-gradient(135deg, var(--mint), var(--sky))';
      setTimeout(() => {
        btn.textContent = 'Let me in!';
        btn.style.background = '';
      }, 2000);
    });

    document.getElementById('signupForm').addEventListener('submit', e => {
      e.preventDefault();
      const btn = e.target.querySelector('.btn-primary');
      btn.textContent = '\u2728 You\'re in!';
      btn.style.background = 'linear-gradient(135deg, var(--mint), var(--sky))';
      setTimeout(() => {
        btn.textContent = 'Create my account';
        btn.style.background = '';
      }, 2000);
    });
  </script>

</body>
</html>
